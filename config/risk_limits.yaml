# BATASAN RISIKO - MODE AGRESIF
#
# File ini SENGAJA dipisah dari settings.yaml agar setiap perubahan
# batas risiko menjadi tindakan yang disadari, bukan efek samping.
#
# Angka di sini dikunci di level kode: risk manager MENOLAK eksekusi
# yang melanggarnya. Jangan longgarkan saat sedang rugi - limit ini
# justru dibuat untuk momen tersebut.

# Equity simulasi untuk mode demo.
simulated_equity_idr: 4000000

# Equity minimum agar bot mau membuka posisi. Melindungi dari akun kosong
# atau akun yang baru saja terkena stop out.
#
# DIKOREKSI 10 Sep 2026. Nilai lama (Rp 3,7 juta) dihitung dari SL 650 pip
# - setelan yang sudah dibuang. SL yang berlaku sekarang 400 pip (maksimum
# 450 pip), jadi dasarnya berubah.
#
# Yang mengunci angka ini: lot minimum broker 0,01 tidak bisa dipecah lagi,
# sehingga rugi per trade adalah nilai TETAP, bukan persentase:
#
#     SL maksimum 4500 points x Rp 1.748,36/point x 0,01 lot = Rp 78.676
#
# Terhadap modal, itu berarti (SL 4500 - varian non-agresif):
#     Rp 5.827.867  -> 1,35%  <- target risiko config tercapai presisi
#     Rp 4.000.000  -> 1,97%  (batas atas "agresif wajar")
#     Rp 3.000.000  -> 2,62%  (agresif)
#     Rp 2.000.000  -> 3,93%  <- ambang dipakai sekarang
#
# DITURUNKAN 4.000.000 -> 2.000.000 (16 Sep 2026) atas permintaan pemilik:
# "aku pasti akan mulai dari modal kecil kyk 2-3 jt aja di akun real jadi
# untuk akun demo akan segitu juga ... tujuanku itu sistemnya emng bener2
# fit gitu bukan berapa rupiah yg didapet".
#
# Tanpa perubahan ini bot MENOLAK SETIAP SINYAL di modal Rp 2-3 juta
# dengan pesan "equity di bawah minimum" - jadi sistemnya tidak akan
# pernah sempat diuji sama sekali.
#
# YANG HARUS DISADARI, dan angkanya bukan tebakan:
#
#   Varian agresif (pyramid5, autoclose_agresif) memakai SL maks 6000
#   points sejak revisi 16 Sep, bukan 4500. Rugi per trade jadi:
#     6000 pts x Rp 1.748,36 x 0,01 lot = Rp 104.902
#
#   modal Rp 2 jt -> 5,25% per trade | 7 loss beruntun = -37% modal
#   modal Rp 3 jt -> 3,50% per trade | 7 loss beruntun = -24% modal
#
#   Varian agresif membuka sampai 10 posisi bersamaan. SATU batch penuh
#   kena SL = Rp 1.049.020 = 52% dari modal Rp 2 juta, dalam satu tarikan.
#
#   Terukur di simulasi_live.py, 100 hari, modal Rp 3 jt:
#     pyramid5           -17,27R   maxDD 79,0%
#     autoclose_agresif  +17,79R   maxDD 55,7%
#     konfluensi         +36,61R   maxDD 28,3%   <- satu-satunya yang wajar
#
# Jadi ambang ini dibuka untuk MENGUJI, bukan karena modal segitu aman
# untuk varian agresif. Untuk modal Rp 2-3 juta, varian yang masuk akal
# dijalankan adalah konfluensi (max 2 posisi), bukan yang 10 posisi.
min_equity_idr: 2000000

# Tiered sizing: dua tingkat sinyal, keduanya terbukti untung, risiko
# beda sesuai jarak ke breakeven.
#   full    (mom_24 > 100% ambang): WR 32,25% | +6,84% vs BE -> risiko penuh
#   reduced (mom_24 > 50% ambang) : WR 28,01% | +2,60% vs BE -> risiko separuh
# Di bawah 50% ambang TIDAK diambil - pengujian menunjukkan tier itu rugi.
# Lihat docs/18-TIERED-SIZING.md
tiered_sizing:
  reduced_risk_multiplier: 0.5   # tier "reduced" pakai 50% dari risiko normal

# Setup frequent_micro (eksperimental, run_bot_frequent.py) - marjin
# keuntungan hanya +0,21% di atas breakeven. Risiko dikecilkan lebih jauh
# dan batas harian diperketat sebagai pengaman tambahan.
frequent_micro_risk_multiplier: 0.5   # dikalikan LAGI setelah tiered (jadi 0.25x dari full)
frequent_micro_max_daily_trades: 15

per_trade:
  # DIREVISI (9 Sep 2026) setelah simulasi risiko.
  #
  # Dengan winrate 26,6%, rentetan 10-15 loss beruntun adalah NORMAL.
  # Simulasi 500 skenario x 300 trade:
  #   risiko 3%  -> maxDD 58,5% | P(DD>30%) 99% | hasil akhir 1,08x
  #   risiko 1%  -> maxDD 25,0% | P(DD>30%) 28% | hasil akhir 1,17x
  #
  # Risiko 1% menghasilkan LEBIH BESAR dengan drawdown kurang dari
  # separuhnya. Pada winrate rendah, risiko besar menggerus basis
  # compounding lewat kerugian beruntun.
  #
  # 1% masih 2x standar profesional (0,5%) - tetap agresif.
  # DIKOREKSI 10 Sep 2026 menjadi angka yang SEBENARNYA berlaku.
  #
  # Nilai 1.0 sebelumnya tidak pernah tercapai. Lot minimum broker (0,01)
  # mengunci risiko pada nilai TETAP:
  #     4000 points x Rp 1.748,36/point x 0,01 lot = Rp 69.934 per trade
  #     4500 points (SL maks)          x 0,01 lot = Rp 78.676 per trade
  #
  # Terhadap equity itu berarti (memakai SL tipikal 4000 points):
  #     Rp 4.000.000 (min_equity_idr)  -> 1,75%  (1,97% pada SL maks)
  #     Rp 5.180.296                   -> 1,35%
  #     Rp 6.993.440                   -> 1,00%
  #
  # Risiko baru turun ke 1% kalau equity di atas ~Rp 7 juta. Di bawah itu
  # lot minimum yang menentukan, bukan angka di file ini.
  #
  # Ditulis 1.35 agar config mencerminkan kenyataan. Ini BUKAN kenaikan
  # risiko - risikonya memang sudah sebesar ini sejak awal, hanya salah
  # tercatat. Lihat docs/27-AUDIT-TEMUAN.md bagian 7.
  max_risk_percent: 1.35
  min_rr_ratio: 2.0           # dinaikkan sebagai kompensasi risiko besar
  max_lot_percent_equity: 5.0 # hard cap absolut

daily:
  max_loss_percent: 4.0       # = 4 loss beruntun pada risiko 1%
  # DINAIKKAN 6 -> 12 (11 Sep 2026) untuk mempercepat pengumpulan data
  # demo TANPA mengorbankan kualitas.
  #
  # Diukur pada data penuh, semua guardrail lain tetap:
  #   daily  6 : n=1502  E[R]=+0,1548  t=3,41  DD 37,8%
  #   daily 12 : n=1751  E[R]=+0,1474  t=3,51  DD 33,5%   <- menang 3 metrik
  #
  # Trade naik 17%, t JUSTRU NAIK, dan drawdown TURUN. Satu-satunya
  # pelonggaran yang menguntungkan dari lima yang diuji.
  #
  # Yang TIDAK boleh ikut dilonggarkan (sudah diukur, semuanya merugikan):
  #   max_consecutive_losses 3 -> 6 : E[R] +0,155 -> +0,083  (rem paling
  #                                   bernilai; setelah 3 loss beruntun
  #                                   pasar memang sedang tidak cocok)
  #   max_open_positions     2 -> 3 : trade tidak naik, DD 37,8% -> 71,2%
  #   tanpa batas sama sekali       : E[R] NEGATIF -0,0208
  #
  # Guardrail di sini bukan rem kecepatan - ia bagian dari strateginya.
  max_trades: 12
  max_consecutive_losses: 3   # stop sisa hari, bukan sekadar jeda

weekly:
  max_loss_percent: 8.0       # stop sisa minggu, evaluasi wajib

global:
  max_drawdown_percent: 20.0  # MATIKAN SISTEM - butuh reset manual
  # DIUKUR ULANG 15 Sep 2026 setelah engine backtest diperbaiki (lihat
  # catatan LOOKAHEAD BIAS di backtest/engine.py::run). Nilai 2 terbaik:
  #
  #   maxpos  1 : n=1560  E[R]=+0,0477  equity akhir Rp 12,7 jt
  #   maxpos  2 : n=1909  E[R]=+0,0673  equity akhir Rp 21,3 jt  <- TERBAIK
  #   maxpos  3 : n=1968  E[R]=+0,0522  equity akhir Rp 11,7 jt
  #   maxpos  5 : n= 585  E[R]=-0,1260  equity akhir MINUS (habis)
  #   maxpos 10 : n= 501  E[R]=-0,1332  equity akhir MINUS (habis)
  #
  # Titik baliknya tajam di atas 3. Sebabnya bukan sinyal yang lebih lemah
  # (skor posisi ke-2+ justru LEBIH TINGGI: 6,77-7,20 vs 6,57), melainkan
  # KORELASI: jeda antar entry median hanya 5 menit, sehingga semua posisi
  # masuk di harga hampir sama, SL-nya berdekatan, dan mereka kena SL
  # BERSAMAAN. Terukur 119 kejadian tutup-bareng melibatkan 347 trade,
  # total rugi Rp 17,9 juta. Posisi ke-10 kena SL 100% - tidak ada yang TP.
  #
  # Multi posisi searah tanpa syarat jarak = memperbesar SATU taruhan
  # 5-10x, bukan diversifikasi.
  #
  # Untuk menguji maxpos 5 di demo tanpa mengganggu forward test ini,
  # pakai varian `pyramid5` (config/variants.yaml) yang punya magic
  # sendiri: python run_bot.py --varian pyramid5
  #
  # KOREKSI ATAS KOMENTAR LAMA: nilai 2 dulu dijelaskan sebagai "satu posisi
  # per arah". Itu TIDAK PERNAH benar - risk manager hanya menghitung TOTAL
  # posisi, tidak memisahkan arah. Akibatnya 2 posisi SEARAH juga lolos, dan
  # itulah yang terjadi 14 Sep 2026 (5 pasang posisi dobel dalam 4-7 detik).
  #
  # Sekarang aturan arah dibuat eksplisit di kode, bukan diasumsikan di
  # komentar: `RiskManager.check()` menolak sinyal yang BERLAWANAN arah
  # dengan posisi yang sudah terbuka. Jadi nilai di bawah = jumlah maksimum
  # posisi SEARAH. Buy dan sell tidak akan pernah terbuka bersamaan dari
  # setup yang sama.
  #
  # KONSEKUENSI (equity Rp 5,58 jt, SL maks 4500 pts):
  #   1 posisi kena SL -> Rp  78.676  (1,41%)
  #   2 posisi kena SL -> Rp 157.352  (2,82%)
  #
  # KEMBALIKAN KE 1 sebelum akun real sampai pyramiding terbukti di demo.
  max_open_positions: 2

# Position sizing adaptif - lot lebih besar saat keyakinan sinyal tinggi.
#
# NONAKTIF secara default, dan itu disengaja.
#
# Menaikkan lot hanya menguntungkan bila skor keyakinan benar-benar
# memprediksi hasil. Pada setup saat ini korelasi skor-hasil = -0,006
# (praktis nol): skor 8 menghasilkan WR 33,0%, skor 7 menghasilkan 33,7%.
# Menaikkan lot berdasar skor semacam itu = membesarkan taruhan acak.
#
# Simulasi 1000 skenario (200 trade):
#   lot tetap 3%       -> median 0,81x | bangkrut  1,5%
#   lot 2x acak        -> median 0,66x | bangkrut 17,4%
#   lot 3x acak        -> median 0,42x | bangkrut 42,8%
#   lot 2x saat WR 55% -> median 1,52x  <- menguntungkan HANYA di sini
#
# SYARAT AKTIVASI: forward test membuktikan sinyal ber-confidence tinggi
# menghasilkan winrate minimal 10 poin di atas sinyal biasa, pada minimal
# 100 trade. Sebelum itu, biarkan false.
adaptive_sizing:
  enabled: false
  max_multiplier: 2.0         # batas keras, tidak boleh lebih
  tiers:
    - {min_confidence: 0.60, multiplier: 1.0}
    - {min_confidence: 0.70, multiplier: 1.5}
    - {min_confidence: 0.80, multiplier: 2.0}

# De-risking otomatis saat drawdown membesar
derisking:
  - {drawdown_above: 10.0, reduce_risk_to: 0.75}
  - {drawdown_above: 15.0, reduce_risk_to: 0.50}
  - {drawdown_above: 20.0, action: STOP_SYSTEM}

# Live deployment bertahap - jangan langsung 3%
live_ramp:
  month_1: 0.5                # verifikasi eksekusi nyata dulu
  month_2: 0.75               # naik jika bulan 1 sesuai ekspektasi
  month_3_plus: 1.0           # penuh jika konsisten

# Penarikan modal - diputuskan SEKARANG, saat belum ada uang di meja
withdrawal:
  at_equity_multiple: 2.0     # saat modal Rp 1.600.000
  withdraw_amount_idr: 800000 # tarik modal awal, lanjut dengan profit saja

# Kill switch
circuit_breaker:
  stop_file: "STOP"           # file di root -> tolak semua entry baru
  mt5_disconnect_seconds: 30
  spread_abnormal_multiplier: 2.0
  consecutive_order_failures: 3
  price_anomaly_atr_multiple: 10

# Blackout berita - fail-safe: jika sumber kalender gagal, JANGAN trading
news_filter:
  minutes_before: 15
  minutes_after: 30
  fail_closed: true           # sumber gagal -> tidak trading (bukan sebaliknya)

# Praktik yang DILARANG - dikunci di kode, bukan sekadar catatan
forbidden:
  martingale: true
  grid_without_sl: true
  averaging_down: true
  trading_without_sl: true
  widening_sl: true
