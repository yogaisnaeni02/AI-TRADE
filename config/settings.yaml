# Konfigurasi Sistem XAUUSD Trading Assistant
#
# Semua angka di sini berasal dari hasil probe broker (docs/broker-specs.md),
# bukan asumsi. Jangan ubah tanpa menjalankan ulang probe.

broker:
  name: Exness
  server: Exness-MT5Trial17
  account: 463942909
  account_type: Standard      # bukan Cent - sudah diverifikasi layak
  currency: IDR
  leverage: 2000
  # DIKOREKSI 10 Sep 2026: sebelumnya 7, dan itu SALAH.
  #
  # Bukti dari data, bukan dari asumsi: pasar forex tutup Jumat dan buka
  # Minggu sekitar 21:00-22:00 UTC (17:00 New York). Pada data/raw/*.parquet
  # kolom time_server jatuh tepat di 21:55/22:00, sedangkan time_utc lama
  # jatuh di 14:55/15:00 - meleset persis 7 jam.
  #
  # Artinya server broker ini UTC+0 dan epoch dari MT5 SUDAH UTC. Nilai 7
  # yang lama membuat downloader mengurangi 7 jam dari nilai yang sudah
  # benar, menggeser seluruh data historis dan membuat klasifikasi sesi
  # salah sasaran. Bot live memakai offset terdeteksi (0) sehingga backtest
  # dan live memperdagangkan jam yang berbeda.
  #
  # Downloader sekarang MENGUKUR offset dan menolak jalan bila nilai di
  # sini tidak cocok - jangan ubah tanpa mengukur ulang.
  server_utc_offset: 0

symbol:
  name: XAUUSDm               # WAJIB pakai akhiran 'm' (konvensi Exness)
                              # JANGAN pakai XAUUSD, BTCXAUm, atau XAUUSD247m
  digits: 3
  point: 0.001                # 1 pip gold (0.01) = 10 points di broker ini
  pip_in_points: 10           # faktor konversi point -> pip
  contract_size: 100.0
  tick_value_idr: 1747.96
  value_per_point_idr: 1748.36
  volume_min: 0.01
  volume_step: 0.01
  volume_max: 200.0
  stops_level: 0              # tidak ada jarak SL/TP minimum

# Biaya transaksi - hasil pengukuran, bukan estimasi
costs:
  spread_points: 260          # = 26 pip. FIXED di semua sesi (akun Standard)
  spread_is_fixed: true       # tidak melebar/menyempit per sesi
  spread_max_accept: 400      # tolak entry di atas ini (= 40 pip)
  swap_long: -526.4           # mahal - hindari posisi menginap
  swap_short: 0.0
  slippage_assume_points: 30  # asumsi backtest (= 3 pip)

# Jarak SL/TP - DIREVISI karena spread 26 pip
# Rencana awal (SL 20 pip) tidak layak: biaya 130% dari risiko
trade_distances:
  # FINAL (9 Sep 2026) - hasil pengujian sistematis pada 100.000 bar M5.
  #
  # Perjalanan kalibrasi:
  #   SL 200 pts  -> lot minimum memaksa risiko 6,6% (ditolak)
  #   SL 1500 pts -> masih di dalam noise 1 bar, WR anjlok 23,8% (ditolak)
  #   SL 6500 pts -> terlalu lebar, E=-0,145R (ditolak)
  #   SL 4000 pts -> OPTIMAL, terukur lewat uji entry acak
  #
  # RR 1:3 dipakai: TP = 3x SL.
  sl_min_points: 3500         # = 350 pip
  sl_typical_points: 4000     # = 400 pip
  sl_max_points: 4500         # = 450 pip
  tp_min_points: 11120        # = 1112 pip (RR 1:2,78 atas SL 4000)
  # DIUBAH 10 Sep 2026: 3.0 -> 2.78 (permintaan pemilik, dan terukur lebih baik).
  #
  # RR efektif setelah spread 260 points, pada SL 4000:
  #   RR 1:3.00 -> efektif 2.756, breakeven WR 26,62%
  #   RR 1:2.78 -> efektif 2.549, breakeven WR 28,17%
  #
  # Breakeven WR memang naik 1,55pp, tapi TP yang lebih dekat lebih sering
  # tercapai dan efek bersihnya positif: pada varian terpilih t naik dari
  # 1,81 (RR 1:3) ke 2,05 (RR 1:2,78).
  #
  # CATATAN: winrate terukur 31,1% (periode penuh) - margin ke breakeven 2,9pp.
  # Jangan naikkan RR lebih jauh tanpa mengukur ulang.
  min_rr_ratio: 2.78
  atr_sl_multiplier: 1.0      # ATR median ~424 pip -> jatuh di rentang di atas

# Manajemen posisi - hasil uji varian
position_management:
  # RIWAYAT PENGUJIAN (9 Sep 2026) - ringkas, urutan kronologis.
  # Semua pada 8.971 entry, sampel besar, anti-lookahead.
  #
  #   tanpa trailing sama sekali        E=+0,0319R  Q+ 3/6  (baseline)
  #   trigger pip absolut (80 pip)      E=-0,0398R  Q+ 1/6  (gagal - trigger tll dini)
  #   trigger %TP tanpa ATR (70%)       E=+0,0069R  Q+ 3/6  (kalah dari terpilih)
  #   momentum-reversal exit            E=+0,0208R  Q+ 4/6  (kalah dari terpilih)
  #   trigger 80% jarak TP + ATR x2,0   E=+0,0308R  Q+ 4/6  <- DIPILIH
  #
  # DIAKTIFKAN atas permintaan eksplisit setelah pola berulang: "profit besar
  # berbalik jadi rugi penuh" (54,3% dari semua trade sempat profit >=80 pip
  # lalu SL penuh). Trade-off yang disadari: expectancy turun tipis
  # (-0,0011R) demi konsistensi lebih baik (4/6 vs 3/6 kuartal positif).
  # Trailing MENGURANGI (bukan menghilangkan) kejadian itu - tidak bisa
  # tahu masa depan, jadi selalu ada kompromi. Detail lengkap semua
  # percobaan: docs/14-TRAILING-80PIP.md bagian 8.
  #
  # Mekanisme: breakeven_at_r = ambang trigger dalam satuan R (bukan geser
  # ke breakeven - begitu tercapai, trailing ATR langsung aktif dari harga
  # saat itu). Pada RR 1:3, 80% jarak TP = 2,4R.
  breakeven_at_r: 2.4          # trigger di 80% jarak TP (RR 1:3 -> 2,4R)
  trail_atr_mult: 2.0          # trailing ATR x2,0 setelah trigger tercapai
  max_bars_hold: 48           # 4 jam

# Setup aktif. london_sweep & ny_momentum dinonaktifkan - keduanya
# terbukti berkinerja di bawah entry acak pada data ini.
# Gate momentum_fib. Dilonggarkan 10 Sep 2026 dari 0,30-0,85.
#
# Alasan lengkap ada di docstring src/strategy/setups.py::_momentum_fib.
# Ringkasnya: rentang lama mencekik frekuensi (106 trade / 1,4 tahun,
# butuh ~29 tahun untuk membuktikan edge). Melonggarkan gate ini menaikkan
# trade 5x DAN menaikkan expectancy.
#
# Untuk kembali ke setelan lama: 0.30 / 0.85.
momentum_fib:
  atr_percentile_min: 0.20
  atr_percentile_max: 0.95

  # Patuhi kolom `is_trading_session` atau tidak.
  #
  # Kolom itu berasal dari daftar SESSIONS hardcode di sessions.py, yang
  # menandai `asia` (23-07 UTC) dan `pre_ny` (10-12 UTC) sebagai
  # trade=false. Penandaan itu warisan kalibrasi lama yang dilakukan pada
  # data berlabel waktu SALAH 7 jam, sehingga tidak punya dasar lagi.
  #
  # Diukur ulang pada data yang sudah benar (10 Sep 2026, 1,41 tahun):
  #   true  (patuhi) : n=457  E[R]=-0,1254  t=-1,65  DD 89%  <- RUGI
  #   false (24 jam) : n=897  E[R]=+0,1254  t=+2,14  DD 32%
  #
  # Jam yang diblokir daftar lama justru yang menguntungkan. false =
  # 24 jam penuh, sesuai keputusan pemilik.
  require_trading_session: false

  # Izinkan sisi SELL. EKSPERIMEN DEMO - jangan bawa ke akun real.
  #
  # Backtest konsisten mengatakan sisi sell tidak punya edge (empat definisi
  # rezim diuji, semuanya memperburuk; lihat docs/43). Dinyalakan di sini
  # HANYA karena tiga hal bertemu:
  #   1. akun demo - salah tidak berbiaya
  #   2. pengamatan manual pemilik bertentangan dengan backtest
  #   3. rezim turun sekarang (14 hari -4,79%) adalah kondisi yang di
  #      backtest hanya muncul di 1 dari 6 kuartal
  #
  # Tanpa ini, bot hanya mengambil 6,3% bar yang memenuhi arah buy dan
  # membuang 28,2% bar sisi sell - forward test praktis mandek selama
  # rezim turun berlangsung.
  #
  # WAJIB: analisis buy dan sell TERPISAH. Sell punya gerbangnya sendiri
  # sebelum boleh ikut ke akun real (docs/29 bagian 9).
  allow_sell: true

active_setups:
  # momentum_fib dipilih sebagai kandidat forward test: satu-satunya
  # konfigurasi dari 11 yang diuji yang mencapai 4/5 fold walk-forward
  # positif. Expectancy-nya tipis (+0,016R) sehingga forward test
  # diperlukan untuk memastikan bukan kebetulan.
  #
  # ny_vol_window tetap tersedia di kode tetapi tidak aktif - hanya
  # 2/5 fold positif.
  - momentum_fib

timeframes:
  primary: M5                 # timeframe eksekusi utama
  entry_timing: M1            # hanya untuk presisi entry
  context: [M15, H1, H4]      # filter bias arah

# Data historis yang tersedia (hasil probe 9 Sep 2026)
data:
  max_bars_per_request: 50000 # batas teknis MT5 - download bertahap di atas ini
  available:
    M1: 50000                 # ~7 minggu - terbatas
    M5: 50000                 # ~8.5 bulan - cukup untuk mulai
    M15: 50000                # ~2 tahun
    H1: 31000                 # ~5 tahun
    H4: 15000                 # ~9 tahun

# CATATAN: blok `sessions:` yang lama DIHAPUS 10 Sep 2026.
#
# Blok itu tidak pernah dibaca kode manapun (diverifikasi grep di src/ dan
# backtest/) - jam trading sesungguhnya diatur di src/strategy/sessions.py
# konstanta SESSIONS. Isinya juga sudah usang: menyebut server UTC+7
# padahal sudah dikoreksi ke UTC+0.
#
# Membiarkannya berbahaya: pembaca config wajar mengira jam trading diatur
# di sini, lalu mengubahnya dan heran kenapa tidak ada efeknya.
#
# Untuk membatasi sesi tanpa menyentuh kode, pakai `momentum_sessions`
# (daftar nama sesi) - dibaca RuleEngine. Kosong/tidak ada = semua sesi.

# EXECUTOR = bot mengirim order sungguhan.
#
# Diaktifkan atas permintaan pemilik (10 Sep 2026) untuk forward test di
# akun DEMO. Yang perlu diketahui sebelum ini diarahkan ke akun real:
#
#   - Basis buktinya t = 2,25, dipilih dari 22 kombinasi yang diuji pada
#     data yang sama. Ambang jujurnya ~2,9 (koreksi Bonferroni).
#   - Setelan yang sama NEGATIF di M15 (-0,141R atas 4,23 tahun), walau
#     stabil positif di kedua paruh M5.
#   - Max drawdown terukur di backtest 20,1%, dan itu pada periode yang
#     expectancy-nya positif.
#
# Justru itu forward test ini dijalankan: mengumpulkan ~200 trade demo
# (sekitar 7 bulan pada 363 trade/tahun) untuk menjawab apakah edge-nya
# nyata. Lihat docs/28-HASIL-KALIBRASI-ULANG.md bagian 4.
mode: EXECUTOR                # OBSERVER -> ADVISOR -> EXECUTOR
                              # jangan naikkan sebelum lulus gate tiap tahap

# Notifikasi Telegram (opsional). Isi keduanya untuk mengaktifkan.
# Panduan setup: lihat docstring di src/monitoring/notifier.py
telegram:
  bot_token: ""    # dari @BotFather
  chat_id: ""       # dari api.telegram.org/bot<TOKEN>/getUpdates
