# Varian sistem — preset bernama untuk memilih dan membandingkan fitur.
#
# MASALAH YANG DISELESAIKAN
# -------------------------
# Sistem ini punya beberapa fitur yang masing-masing punya flag sendiri
# (confluence_filter, allow_sell, dst) tersebar di settings.yaml. Untuk
# menjalankan atau membandingkan satu kombinasi tertentu, sebelumnya harus
# mengedit settings.yaml manual — mudah salah, dan tidak ada cara cepat
# membandingkan "yang mana lebih baik" tanpa membaca kode.
#
# Tiap entri di sini adalah SATU KOMBINASI bernama. Semuanya override
# kecil di atas settings.yaml dasar — tidak menduplikasi seluruh config.
#
# CARA PAKAI
# ----------
#   python run_bot.py --varian konfluensi
#   python backtest/bandingkan_varian.py                 # semua varian
#   python backtest/bandingkan_varian.py --varian baseline konfluensi
#
# MAGIC NUMBER per varian supaya bisa jalan BERDAMPINGAN di akun yang sama
# tanpa bercampur di journal/dashboard. Basis 20260909 (sistem ini),
# +N per varian. JANGAN mengubah magic varian yang sudah pernah dipakai
# live — riwayat trade lama akan salah terhubung.
#
# Status "terverifikasi" merujuk ke dokumen yang mengukurnya. Sebelum
# memindahkan status apa pun ke "aktif produksi", baca dokumennya dulu.

# CATATAN PENTING: settings.yaml itu sendiri BUKAN netral. Sejak eksperimen
# dua-arah dimulai (11 Sep 2026), settings.yaml dasar sudah punya
# `momentum_fib.allow_sell: true` tertulis langsung di sana — bukan lewat
# varian. Supaya nama "baseline" benar-benar berarti "BUY saja, tanpa fitur
# tambahan" dan tidak diam-diam ikut hanyut saat settings.yaml berubah,
# baseline di sini SECARA EKSPLISIT me-reset setiap flag fitur ke nilai
# ilmiahnya (mati), bukan override: {}. Setiap varian lain juga menyatakan
# NILAI PENUH tiap flag yang relevan, bukan cuma yang diaktifkannya —
# supaya satu varian tidak diam-diam mewarisi flag varian lain lewat
# settings.yaml.

varian:

  baseline:
    magic: 20260909
    deskripsi: >
      BUY searah momentum, tanpa filter tambahan. Definisi ilmiah "polos" -
      dipertahankan tetap sama walau settings.yaml dasar berubah.
    status: forward-test-aktif
    override:
      momentum_fib:
        allow_sell: false
        confluence_filter: false

  konfluensi:
    magic: 20260910
    deskripsi: >
      Baseline + filter candle searah + ADX>25 + tren M5 tidak melawan.
      Satu-satunya kandidat yang lolos holdout tersegel DAN ambang t~3,0.
    status: terverifikasi-belum-produksi
    dokumen: docs/36-UJI-GABUNGAN-TEKNIK.md, docs/38-PERBANDINGAN-RISET-PARALEL.md
    hasil_backtest:
      n: 519
      E_R: 0.2510
      t: 3.14
      holdout_E_R: 0.2805
    override:
      momentum_fib:
        allow_sell: false
        confluence_filter: true

  dua_arah:
    magic: 20260911
    deskripsi: >
      Baseline + sisi SELL diaktifkan. Backtest bilang sell tidak punya
      edge (empat definisi rezim diuji, semua memperburuk) - dinyalakan
      sebagai eksperimen DEMO karena rezim turun saat ini jarang muncul
      di data historis. Ini VARIAN YANG SAMA dengan yang sedang berjalan
      lewat settings.yaml (allow_sell: true) - didaftarkan di sini supaya
      bisa dibandingkan lewat nama, bukan lewat membaca settings.yaml.
    status: eksperimen-demo-aktif
    dokumen: docs/43-KENAPA-CUMA-BUY-DAN-MOMEN-SELL.md
    peringatan: >
      JANGAN bawa ke akun real. Sisi sell belum lolos gerbangnya sendiri
      (docs/29 bagian 9).
    override:
      momentum_fib:
        allow_sell: true
        confluence_filter: false

  dua_arah_konfluensi:
    magic: 20260912
    deskripsi: >
      Gabungan dua_arah + konfluensi. BELUM diukur sebagai kombinasi -
      konfluensi diverifikasi hanya untuk BUY (docs/36). Menjalankan ini
      berarti menguji kombinasi baru, bukan mengulang hasil yang ada.
    status: belum-diukur
    override:
      momentum_fib:
        allow_sell: true
        confluence_filter: true

  pyramid5:
    magic: 20260914
    deskripsi: >
      Multi posisi SEARAH sampai 10 bersamaan, tanpa syarat jarak harga,
      dengan rentetan rugi dihitung PER BATCH bukan per posisi.

      Satu batch = sekelompok posisi yang terbuka bersamaan dari satu
      momentum. Batch berakhir saat SELURUH posisinya tutup. Batch dihitung
      rugi hanya bila SEMUA posisi di dalamnya rugi. Maks 3 batch rugi
      beruntun -> stop sisa hari.

      Permintaan pemilik: 10 posisi dari satu momentum adalah SATU taruhan,
      jadi tidak adil dihitung sebagai 10 loss terpisah.
    status: eksperimen-demo-backtest-negatif
    dokumen: docs/52-MODE-BATCH.md
    peringatan: >
      BACKTEST NEGATIF pada pengujian maxpos biasa. Pada data 516 hari,
      maxpos 5 membuat modal HABIS (Rp 5,58 jt -> minus, E[R] -0,126) dan
      maxpos 10 lebih buruk lagi. Mode batch belum diuji backtest secara
      terpisah. Dijalankan sebagai eksperimen DEMO untuk melihat apakah
      perilaku live berbeda - BUKAN karena diperkirakan menguntungkan.
      JANGAN ke akun real.
    hasil_backtest:
      maxpos_1: {E_R: 0.0477, equity_akhir: 12731823}
      maxpos_2: {E_R: 0.0673, equity_akhir: 21304756}
      maxpos_3: {E_R: 0.0522, equity_akhir: 11714623}
      maxpos_5: {E_R: -0.1260, equity_akhir: -2373}
      maxpos_10: {E_R: -0.1332, equity_akhir: -140245}
    override:
      momentum_fib:
        allow_sell: true
        confluence_filter: false
    # SEMUA BATAS RUPIAH DINAIKKAN agar rem BATCH yang menyala duluan.
    #
    # Aritmetikanya (equity Rp 5.578.289, rugi per posisi Rp 78.676):
    #   1 batch (10 posisi) kena SL semua -> Rp   786.760 = 14,1%
    #   2 batch (20 posisi)               -> Rp 1.573.520 = 28,2%
    #   3 batch (30 posisi)               -> Rp 2.360.280 = 42,3%
    #
    # Supaya rem "3 batch beruntun" yang benar-benar menghentikan (bukan
    # rem rupiah yang menyala lebih dulu), batas rupiah harus di atas 42,3%.
    #
    # KONSEKUENSI YANG HARUS DISADARI: varian ini boleh kehilangan ~42%
    # modal dalam SATU HARI sebelum berhenti. Itu keputusan sadar pemilik
    # untuk eksperimen DEMO - bukan angka yang boleh dibawa ke akun real.
    override_risk:
      global:
        max_open_positions: 10
        # Circuit breaker dinaikkan 20% -> 50%. Tanpa ini, breaker menyala
        # di batch ke-2 dan MENGHENTIKAN SISTEM TOTAL (butuh reset manual),
        # sehingga rem batch tidak pernah sempat diuji.
        max_drawdown_percent: 50.0
      daily:
        loss_mode: batch
        max_consecutive_loss_batches: 3
        # 3 batch x 10 posisi = 30 trade. Batas lama 12 habis di batch
        # pertama, jadi konsep batch tidak akan pernah terpakai.
        max_trades: 35
        max_loss_percent: 45.0
      weekly:
        # Mingguan juga harus di atas 42,3%, kalau tidak rem mingguan yang
        # menyala duluan di hari pertama.
        max_loss_percent: 45.0

  autoclose:
    magic: 20260915
    deskripsi: >
      Baseline + auto-close saat skor keyakinan (0-100) turun >=20 poin
      dari nilai saat posisi dibuka, HANYA bila posisi sedang profit.
      Tujuannya mengunci sebagian keuntungan saat kondisi yang mendasari
      sinyal sudah memudar - bukan memotong kerugian (itu tugas SL).
    status: terukur-tipis-belum-produksi
    dokumen: docs/53-AUTOCLOSE-SKOR.md
    hasil_backtest:
      tanpa_autoclose: {E_R: 0.2815, t: 5.92}
      turun_10: {E_R: 0.2477}
      turun_15: {E_R: 0.2835}
      turun_20: {E_R: 0.2994, catatan: "terbaik"}
      turun_25: {E_R: 0.2855}
      turun_40: {E_R: 0.2672}
      stabilitas: "positif kedua paruh (+0,013 / +0,025)"
      kena: "237 dari 1440 trade (16,5%)"
    peringatan: >
      Perbaikannya TIPIS: +0,018R per trade (~6%), dan nilai t justru turun
      sedikit (5,92 -> 5,82). Ini mengunci profit, bukan menemukan edge
      baru. Jangan berharap perubahan besar.
    override:
      momentum_fib:
        allow_sell: true
        confluence_filter: false
      position_management:
        autoclose_score_drop: 20

  ml_walkforward:
    magic: 20260913
    deskripsi: >
      Baseline + filter ML walk-forward (buang 25% probabilitas TP
      terendah). AUC 0,56 out-of-sample, lolos stabilitas seed dan sapuan
      hiperparameter (docs/46). BELUM diintegrasikan ke RuleEngine -
      masih di scripts/ml_walk_forward.py sebagai riset berdiri sendiri.
    status: riset-belum-diintegrasikan
    dokumen: docs/46-VERIFIKASI-ML-WALK-FORWARD.md
    override: {}   # tidak bisa diaktifkan lewat config - lihat status
